<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaf Theme Shop</title>
    <style>
        /* Base Styling & Pretty Leaf Theme */
        :root {
            --leaf-green: #4CAF50;
            --soft-green: #E8F5E9;
            --dark-green: #2E7D32;
            --text-color: #333;
            --border-color: #C8E6C9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #FAFAFA;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--dark-green);
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        .leaf-icon {
            font-size: 1.5rem;
            color: var(--leaf-green);
        }

        /* Working Navigation Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 30px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            color: #666;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .tab-btn:hover {
            color: var(--dark-green);
        }

        .tab-btn.active {
            color: var(--dark-green);
            border-bottom: 3px solid var(--leaf-green);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Product Grid and Card Design */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-title {
            font-size: 1.3rem;
            color: var(--dark-green);
            margin: 0 0 10px 0;
        }

        .product-price {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* Conditional Layouts Rules */
        .options-row {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
        }

        .option-group {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: #555;
        }

        select, input[type="number"] {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: white;
            font-size: 0.95rem;
            width: 100%;
            box-sizing: border-box;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--leaf-green);
        }

        .add-btn {
            background-color: var(--leaf-green);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .add-btn:hover {
            background-color: var(--dark-green);
        }

        /* Shopping Cart Design */
        .cart-wrapper {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #EDEDED;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-details h4 {
            margin: 0 0 5px 0;
            color: var(--dark-green);
        }

        .cart-details p {
            margin: 0;
            font-size: 0.9rem;
            color: #666;
        }

        .cart-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .cart-qty-input {
            width: 60px !important;
            text-align: center;
        }

        .remove-btn {
            background: none;
            border: none;
            color: #cc0000;
            cursor: pointer;
            font-weight: 600;
        }

        .cart-total {
            text-align: right;
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 20px;
            color: var(--dark-green);
        }

        .empty-message {
            text-align: center;
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>The Leaf Boutique <span class="leaf-icon">🍃</span></h1>
        <p>Everything is pretty, organized, and working perfectly.</p>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab(event, 'shop')">Shop Products</button>
        <button class="tab-btn" onclick="openTab(event, 'cart')">Shopping Cart (<span id="cart-count">0</span>)</button>
    </div>

    <div id="shop" class="tab-content active">
        <div class="product-grid">

            <div class="product-card" id="p1">
                <div>
                    <h3 class="product-title">Fern Linen Summer Dress</h3>
                    <div class="product-price">$68.00</div>
                    
                    <div class="options-row">
                        <div class="option-group">
                            <label>Size</label>
                            <select class="prod-size">
                                <option value="Small">Small</option>
                                <option value="Medium">Medium</option>
                                <option value="Large">Large</option>
                            </select>
                        </div>
                        <div class="option-group">
                            <label>Colour</label>
                            <select class="prod-color">
                                <option value="Sage Green">Sage Green</option>
                                <option value="Olive">Olive</option>
                                <option value="Ivory">Ivory</option>
                            </select>
                        </div>
                    </div>
                </div>
                <button class="add-btn" onclick="addToCart('p1', 'Fern Linen Summer Dress', 68.00, true)">Add to Cart</button>
            </div>

            <div class="product-card" id="p2">
                <div>
                    <h3 class="product-title">Monstera Ceramic Mug</h3>
                    <div class="product-price">$24.00</div>
                    
                    <div class="options-row">
                        <div class="option-group">
                            <label>Colour</label>
                            <select class="prod-color">
                                <option value="Forest Green">Forest Green</option>
                                <option value="Mint">Mint</option>
                                <option value="Terracotta">Terracotta</option>
                            </select>
                        </div>
                        <div class="option-group">
                            <label>Quantity</label>
                            <input type="number" class="prod-qty" value="1" min="1">
                        </div>
                    </div>
                </div>
                <button class="add-btn" onclick="addToCart('p2', 'Monstera Ceramic Mug', 24.00, false)">Add to Cart</button>
            </div>

            <div class="product-card" id="p3">
                <div>
                    <h3 class="product-title">Botanical Print Hoodie</h3>
                    <div class="product-price">$55.00</div>
                    
                    <div class="options-row">
                        <div class="option-group">
                            <label>Size</label>
                            <select class="prod-size">
                                <option value="XS">XS</option>
                                <option value="S">S</option>
                                <option value="M">M</option>
                                <option value="L">L</option>
                            </select>
                        </div>
                        <div class="option-group">
                            <label>Colour</label>
                            <select class="prod-color">
                                <option value="Moss">Moss</option>
                                <option value="Charcoal">Charcoal</option>
                            </select>
                        </div>
                    </div>
                </div>
                <button class="add-btn" onclick="addToCart('p3', 'Botanical Print Hoodie', 55.00, true)">Add to Cart</button>
            </div>

        </div>
    </div>

    <div id="cart" class="tab-content">
        <div class="cart-wrapper">
            <div id="cart-items-container">
                </div>
            <div class="cart-total" id="cart-total-display">Total: $0.00</div>
        </div>
    </div>
</div>

<script>
    // Global Cart State
    let cart = [];

    // Working Tab Navigation Logic
    function openTab(evt, tabName) {
        let i, tabcontent, tablinks;
        tabcontent = document.getElementsByClassName("tab-content");
        for (i = 0; i < tabcontent.length; i++) {
            tabcontent[i].classList.remove("active");
        }
        tablinks = document.getElementsByClassName("tab-btn");
        for (i = 0; i < tablinks.length; i++) {
            tablinks[i].classList.remove("active");
        }
        document.getElementById(tabName).classList.add("active");
        evt.currentTarget.classList.add("active");
    }

    // Add to Cart Logic with specific variants checks
    function addToCart(productId, name, price, hasSize) {
        const card = document.getElementById(productId);
        const color = card.querySelector('.prod-color').value;
        
        let size = null;
        let quantity = 1;

        if (hasSize) {
            size = card.querySelector('.prod-size').value;
            // Products with sizes default to 1 quantity when clicked, fully changeable in cart later
            quantity = 1; 
        } else {
            quantity = parseInt(card.querySelector('.prod-qty').value) || 1;
        }

        // Create a distinct key identification matching items with the same variants
        const itemKey = `${productId}-${size}-${color}`;

        // Check if item variant configuration already exists in cart
        const existingItem = cart.find(item => item.key === itemKey);

        if (existingItem) {
            existingItem.quantity += quantity;
        } else {
            cart.push({
                key: itemKey,
                id: productId,
                name: name,
                price: price,
                color: color,
                size: size,
                hasSize: hasSize,
                quantity: quantity
            });
        }

        updateCartUI();
        alert(`Added ${name} to your cart!`);
    }

    // Change individual item quantities within shopping cart
    function changeCartQuantity(itemKey, newQty) {
        const qty = parseInt(newQty);
        const item = cart.find(i => i.key === itemKey);
        
        if (item && qty > 0) {
            item.quantity = qty;
        } else if (qty <= 0) {
            removeItem(itemKey);
            return;
        }
        updateCartUI();
    }

    // Remove single variant row completely
    function removeItem(itemKey) {
        cart = cart.filter(item => item.key !== itemKey);
        updateCartUI();
    }

    // Render and update cart interface elements dynamically
    function updateCartUI() {
        const container = document.getElementById('cart-items-container');
        const totalDisplay = document.getElementById('cart-total-display');
        const countDisplay = document.getElementById('cart-count');
        
        container.innerHTML = '';
        let total = 0;
        let totalItemsCount = 0;

        if (cart.length === 0) {
            container.innerHTML = '<p class="empty-message">Your shopping cart is empty 🍃</p>';
            totalDisplay.innerText = "Total: $0.00";
            countDisplay.innerText = "0";
            return;
        }

        cart.forEach(item => {
            const itemTotal = item.price * item.quantity;
            total += itemTotal;
            totalItemsCount += item.quantity;

            const itemRow = document.createElement('div');
            itemRow.className = 'cart-item';

            // Displays size configuration strings cleanly if variant is size-inclusive
            const detailsString = item.hasSize 
                ? `Colour: ${item.color} | Size: ${item.size}` 
                : `Colour: ${item.color}`;

            // Rule: Quantities can always be changed seamlessly here
            itemRow.innerHTML = `
                <div class="cart-details">
                    <h4>${item.name}</h4>
                    <p>${detailsString}</p>
                    <p><strong>$${item.price.toFixed(2)} each</strong></p>
                </div>
                <div class="cart-actions">
                    <label style="margin:0;">Qty:</label>
                    <input type="number" class="cart-qty-input" value="${item.quantity}" min="1" onchange="changeCartQuantity('${
