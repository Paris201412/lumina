<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaf Theme Shop</title>
    <style>
        /* Base Styling & Pretty Leaf Theme */
        :root {
            --leaf-green: #4CAF50;
            --soft-green: #E8F5E9;
            --dark-green: #2E7D32;
            --text-color: #333;
            --border-color: #C8E6C9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #FAFAFA;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--dark-green);
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        .leaf-icon {
            font-size: 1.5rem;
            color: var(--leaf-green);
        }

        /* Working Navigation Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 30px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            color: #666;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .tab-btn:hover {
            color: var(--dark-green);
        }

        .tab-btn.active {
            color: var(--dark-green);
            border-bottom: 3px solid var(--leaf-green);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Product Grid and Card Design */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-title {
            font-size: 1.3rem;
            color: var(--dark-green);
            margin: 0 0 10px 0;
